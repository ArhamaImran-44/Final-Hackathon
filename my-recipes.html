<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeShare - Create Recipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body shadow-sm">

        <div class="container-fluid">

            <!-- Logo -->

            <a class="navbar-brand d-flex align-items-center fw-bold"
                href="./index.html">

                <span class="fs-4">🍳</span>

                <span class="ms-2">
                    Recipe<span class="text-warning">Share</span>
                </span>

            </a>


            <!-- Mobile Button -->

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navbar Links -->

            <div class="collapse navbar-collapse"
                id="navbarSupportedContent">

                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 text-center">

                    <li class="nav-item">
                        <a class="nav-link"
                            href="./index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="./recipes.html">
                            Recipes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="./dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="./my-recipes.html">
                            My Recipes
                        </a>
                    </li>

                </ul>


                <!-- Login / Signup -->

                <div class="text-center" id="loginSignupBtn">

                    <a href="./login.html"
                        class="text-black bg-light p-2 rounded-2 text-decoration-none">

                        Login

                    </a>

                    <a href="./signup.html"
                        class="text-black bg-warning p-2 rounded-2 text-decoration-none">

                        Sign Up

                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- Create Recipe Section -->

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <!-- Heading -->

                        <h2 class="text-center fw-bold mb-2">
                            Create Your Recipe
                        </h2>

                        <p class="text-center text-secondary mb-4">
                            Share your favorite recipe with the community.
                        </p>


                        <!-- Recipe Form -->

                        <form>


                            <!-- Recipe Title -->

                            <div class="mb-3">

                                <label for="title"
                                    class="form-label">

                                    Recipe Title

                                </label>

                                <input type="text"
                                    id="title"
                                    name="title"
                                    class="form-control"
                                    placeholder="Enter recipe title">

                            </div>


                            <!-- Description -->

                            <div class="mb-3">

                                <label for="description"
                                    class="form-label">

                                    Description

                                </label>

                                <textarea id="description"
                                    name="description"
                                    class="form-control"
                                    rows="3"
                                    placeholder="Write a short description"></textarea>

                            </div>


                            <!-- Category -->

                            <div class="mb-3">

                                <label for="category"
                                    class="form-label">

                                    Category

                                </label>

                                <select id="category"
                                    name="category"
                                    class="form-select">

                                    <option selected>
                                        Select Category
                                    </option>

                                    <option>
                                        Pakistani
                                    </option>

                                    <option>
                                        Italian
                                    </option>


                                    <option>
                                        Desserts
                                    </option>

                                    <option>
                                        Fast Food
                                    </option>

                                    <option>
                                        Healthy
                                    </option>

                                </select>

                            </div>


                            <!-- Ingredients -->

                            <div class="mb-3">

                                <label for="ingredients"
                                    class="form-label">

                                    Ingredients

                                </label>

                                <textarea id="ingredients"
                                    name="ingredients"
                                    class="form-control"
                                    rows="5"
                                    placeholder="Enter ingredients"></textarea>

                            </div>


                            <!-- Instructions -->

                            <div class="mb-3">

                                <label for="instructions"
                                    class="form-label">

                                    Instructions

                                </label>

                                <textarea id="instructions"
                                    name="instructions"
                                    class="form-control"
                                    rows="6"
                                    placeholder="Write step-by-step instructions"></textarea>

                            </div>


                            <!-- Cooking Time -->

                            <div class="mb-3">

                                <label for="cookingTime"
                                    class="form-label">

                                    Cooking Time

                                </label>

                                <input type="text"
                                    id="cookingTime"
                                    name="cookingTime"
                                    class="form-control"
                                    placeholder="Example: 45 minutes">

                            </div>


                            <!-- Recipe Image -->

                            <div class="mb-4">

                                <label for="recipeImage"
                                    class="form-label">

                                    Recipe Image

                                </label>

                                <input type="file"
                                    id="recipeImage"
                                    name="recipeImage"
                                    class="form-control"
                                    accept="image/*">

                            </div>


                            <!-- Buttons -->

                            <div class="d-flex gap-2">

                                <button type="submit"
                                    class="btn btn-warning">

                                    Add Recipe

                                </button>

                                <a href="./recipes.html"
                                    class="btn btn-outline-secondary">

                                    Cancel

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>
<!-- SweetAlert2 CDN -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
