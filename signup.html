<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeShare - Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg bg-body shadow-sm">

        <div class="container-fluid">

            <!-- Logo -->

            <a class="navbar-brand d-flex align-items-center fw-bold" href="./index.html">

                <span class="fs-4">🍳</span>

                <span class="ms-2">
                    Recipe<span class="text-warning">Share</span>
                </span>

            </a>


            <!-- Mobile Button -->

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navbar Content -->

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 text-center">

                    <li class="nav-item">
                        <a class="nav-link" href="./index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./recipes.html">
                            Recipes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./my-recipes.html">
                            My Recipes
                        </a>
                    </li>

                </ul>


                <!-- Login and Signup Buttons -->

                <div class="text-center" id="loginSignupBtn">

                    <a href="./login.html"
                        class="text-black bg-light p-2 rounded-2 text-decoration-none">

                        Login

                    </a>

                    <a href="./signup.html"
                        class="text-black bg-warning p-2 rounded-2 text-decoration-none">

                        Sign Up

                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- Signup Section -->

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <h2 class="text-center fw-bold">
                            Create Account
                        </h2>

                        <p class="text-center text-secondary mb-4">
                            Join RecipeShare today
                        </p>


                        <!-- Signup Form -->

                        <form id="signupForm">

                            <!-- Full Name -->

                            <div class="mb-3">

                                <label for="name" class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                    id="name"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter your name">

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter your email">

                            </div>


                            <!-- Password -->

                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter password">

                            </div>


                            <!-- Signup Button -->

                            <button type="submit"
                                id="signupBtn"
                                class="btn btn-warning w-100">

                                Create Account

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
