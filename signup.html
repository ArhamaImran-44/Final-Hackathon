<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RecipeShare - Sign Up</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <!-- Logo -->

            <a class="navbar-brand fw-bold text-danger" href="index.html">
                🍳 RecipeShare
            </a>


            <!-- Mobile Button -->

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navbar Links -->

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-center gap-2">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="recipes.html">
                            Recipes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="login.html" class="btn btn-outline-danger">
                            Login
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="signup.html" class="btn btn-danger">
                            Sign Up
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Signup Section -->

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <!-- Heading -->

                        <h2 class="text-center fw-bold">
                            Create Account
                        </h2>

                        <p class="text-center text-secondary mb-4">
                            Join RecipeShare today
                        </p>


                        <!-- Signup Form -->

                        <form>


                            <!-- Full Name -->

                            <div class="mb-3">

                                <label for="name" class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                    id="name"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter your name">

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter your email">

                            </div>


                            <!-- Password -->

                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter password">

                            </div>


                            <!-- Signup Button -->

                            <button type="submit"
                                class="btn btn-danger w-100">

                                Create Account

                            </button>

                        </form>


                        <!-- Login Link -->

                        <p class="text-center mt-3 mb-0">

                            Already have an account?

                            <a href="login.html"
                                class="text-danger text-decoration-none">

                                Login

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
